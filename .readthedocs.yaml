version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - mkdir -p $READTHEDOCS_OUTPUT/pdf

    - |
      echo "RTD_LANG: $READTHEDOCS_LANGUAGE"
      echo "RTD_LANG: ${READTHEDOCS_LANGUAGE}"
      if [ x"$READTHEDOCS_LANGUAGE" = x"zh-cn" ]; then
        echo "deploying simplified chinese prebuilt docs..."
        cp -r build/html/zh_cn/* $READTHEDOCS_OUTPUT/html
        cp -r build/pdf/zh_cn/* $READTHEDOCS_OUTPUT/pdf
      else
        cp -r build/html/en/* $READTHEDOCS_OUTPUT/html
        cp -r build/pdf/en/* $READTHEDOCS_OUTPUT/pdf
      fi
